<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>tidyTIVI · Dropbox setup</title>
<style>body{background:#171a1f;color:#f4f4f4;font:16px/1.5 system-ui,sans-serif;margin:0;padding:32px 20px}main{max-width:620px;margin:auto}h1{font-size:27px}h2{font-size:18px;margin-top:28px}p{color:#bec5ce}a{color:#72c7ee}button,.button{font:inherit;border:0;border-radius:7px;padding:12px 18px;background:#0793d7;color:white;cursor:pointer;display:inline-block;text-decoration:none}button:disabled{opacity:.5;cursor:wait}input,textarea{box-sizing:border-box;width:100%;background:#242a32;color:white;border:1px solid #637083;border-radius:7px;font:16px/1.5 system-ui;padding:12px;margin:8px 0 12px}textarea{min-height:130px;overflow-wrap:anywhere;resize:vertical}label{display:block}nav{display:flex;gap:20px}#status{white-space:pre-wrap}#error{color:#ffb6b6}details{margin:15px 0}small{color:#bec5ce}[hidden]{display:none!important}</style>
<main><nav><a href="/plugins">Back to Dispatcharr</a><a href="https://github.com/ayala/tidyTIVI/blob/main/CLOUD-SETUP.md" target="_blank" rel="noreferrer">Setup guide</a></nav>
<h1>Connect your Dropbox</h1><p id="status" role="status">Checking connection…</p><p id="error" role="alert"></p>
<button id="start" disabled>Connect Dropbox</button>
<section id="pending" hidden><h2>1. Approve access in Dropbox</h2><a id="open" class="button" target="_blank" rel="noreferrer noopener">Open Dropbox</a><details><summary>Copy the full link instead</summary><textarea id="link" readonly aria-label="Full Dropbox authorization link"></textarea><button id="copy">Copy link</button></details>
<h2>2. Paste the code from Dropbox</h2><form id="finish"><label for="code">One-time connection code</label><input id="code" type="password" autocomplete="off" required><button id="save" type="submit">Finish connection</button></form><button id="cancel" style="background:#444">Cancel this attempt</button></section>
<p><small>After connecting, enable Upload after export in tidyTIVI settings.</small></p></main>
<script>
const status=document.getElementById('status'),error=document.getElementById('error'),start=document.getElementById('start'),pending=document.getElementById('pending'),code=document.getElementById('code');
async function api(action,params={}){
 let token=localStorage.getItem('accessToken');if(!token)throw Error('Sign in to Dispatcharr in this browser, then reload this page.');
 const call=()=>fetch('/api/plugins/plugins/tidytivi/run/',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action,params})});
 let r=await call();if(r.status===401){const refresh=localStorage.getItem('refreshToken');if(refresh){const renewed=await fetch('/api/accounts/token/refresh/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh})});if(renewed.ok){const auth=await renewed.json();if(auth.access){token=auth.access;localStorage.setItem('accessToken',token);if(auth.refresh)localStorage.setItem('refreshToken',auth.refresh);r=await call();}}}}
 if(!r.ok)throw Error(r.status===401?'Your Dispatcharr login expired. Sign in again, then reload.':'Dispatcharr denied the request. Check that tidyTIVI is enabled and your account can manage plugins.');
 const data=await r.json();if(!data.success||data.result?.status!=='ok')throw Error(data.result?.message||'Could not complete the request.');return data.result;
}
function showLink(url){if(!url){pending.hidden=true;return;}const u=new URL(url);if(u.origin!=='https://www.dropbox.com'||u.pathname!=='/oauth2/authorize')throw Error('Unexpected authorization address.');document.getElementById('open').href=url;document.getElementById('link').value=url;pending.hidden=false;}
function render(result){status.textContent=result.connected?'Dropbox is connected. You do not need to reconnect.':result.message;start.textContent=result.connected?'Reconnect Dropbox':'Connect Dropbox';showLink(result.authorization_url);}
start.onclick=async()=>{error.textContent='';start.disabled=true;const tab=window.open('about:blank','_blank');if(tab)tab.opener=null;try{const r=await api('dropbox_connect');showLink(r.authorization_url);status.textContent='Approve access in Dropbox, then paste its code below.';if(tab)tab.location.href=document.getElementById('open').href;}catch(e){if(tab)tab.close();error.textContent=e.message;}finally{start.disabled=false;}};
document.getElementById('finish').onsubmit=async e=>{e.preventDefault();error.textContent='';const save=document.getElementById('save');save.disabled=true;try{const r=await api('dropbox_finish',{code:code.value.trim()});code.value='';pending.hidden=true;status.textContent=r.message;start.textContent='Reconnect Dropbox';}catch(e){code.value='';error.textContent=e.message;}finally{save.disabled=false;}};
document.getElementById('cancel').onclick=async()=>{try{await api('dropbox_cancel');code.value='';render(await api('dropbox_status'));}catch(e){error.textContent=e.message;}};
document.getElementById('copy').onclick=async()=>{const field=document.getElementById('link');field.focus();field.select();try{await navigator.clipboard.writeText(field.value);}catch(e){document.execCommand('copy');}};
api('dropbox_status').then(render).catch(e=>error.textContent=e.message).finally(()=>start.disabled=false);
</script></html>
